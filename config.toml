[models]
metadata = "gemini-3-flash-preview"
script   = "gemini-3-pro-preview"
tts      = "gemini-3.1-flash-tts-preview"

[voices]
host_a = "Puck"
host_b = "Kore"

[script]
target_words = 1600
max_pages    = 120

# How hard the model reasons before writing. Dense papers reward more of it,
# and scripting is ~2% of an episode's cost, so this is cheap to raise.
# One of: MINIMAL, LOW, MEDIUM, HIGH. Leave empty for the model's default.
thinking_level = "HIGH"

# Let the script model search the web while writing. Off by default: the
# citation safeguards assume every claim comes from the PDF, and grounding
# deliberately relaxes that (see prompts/script_grounding.md). When on, the
# sources it used are recorded and shown on the episode.
grounding = false

# If the script model has no quota (a preview Pro often returns limit: 0),
# fall back to this rather than failing the episode. Empty disables the
# fallback. The substitution is recorded in the stage log.
fallback_model = "gemini-3-flash-preview"

[tts]
# Models offered in the upload picker, first one the default. Verify IDs
# against /admin/models before adding — a wrong ID 404s every chunk.
#
# TTS models only. The Live models (gemini-3.1-flash-live-preview,
# gemini-2.5-flash-native-audio-preview-12-2025) are bidirectional streaming
# models for real-time dialogue; they are not reachable through the
# generateContent call this pipeline makes, so listing one here would fail
# every chunk.
models = [
  "gemini-3.1-flash-tts-preview",   # default: expressive, highest cost
  "gemini-2.5-pro-preview-tts",     # high fidelity, aimed at podcasts/audiobooks
  "gemini-2.5-flash-preview-tts",   # fastest and cheapest
]
# Chunk size in words. Split only on speaker-turn boundaries.
chunk_target_words = 250
chunk_max_words    = 320
# How many preceding turns to include as (unspoken) context for prosody.
context_turns      = 2

[retry]
# Transient API failures (429 rate limits, 5xx) are retried on the server's
# own schedule when it supplies one -- Gemini's 429s often ask for 10-30s,
# well past what plain exponential backoff would wait.
attempts     = 4
base_delay_s = 2
max_delay_s  = 60
# Ceiling on a single API call. Without one a stalled connection blocks its
# worker forever: the episode sits in "synthesizing" with no error, and with
# one worker nothing behind it ever starts. Timeouts count as retryable.
request_timeout_s = 600

[audio]
seam_silence_ms = 250
lufs_target     = -16.0
true_peak       = -1.5
lra             = 11.0
bitrate         = "96k"

[server]
base_url = "http://localhost:8000"
port     = 8000
# How many episodes to process at once. The pipeline spends nearly all its
# time waiting on Gemini, so extra workers cost almost no CPU -- the real
# ceilings are the account's requests-per-minute and disk headroom during
# assembly, which briefly needs ~2x an episode's chunk audio. Raise slowly
# and watch for 429s.
workers  = 2

[feed]
title       = "Paperpod"
description = "AI Generated Podcast Discussions of Important Papers."
author      = "Paperpod"

[site]
# Shown on the terms page and used as the podcast owner contact in the feed.
owner_name    = "Josh Paul"
contact_email = "jbpaul275@gmail.com"

# USD per 1M tokens. TTS prices are the documented preview prices; the two
# text-model prices are estimates -- verify against current Gemini pricing.
[costs."gemini-3-flash-preview"]
input_per_1m  = 0.30
output_per_1m = 2.50

[costs."gemini-3-pro-preview"]
input_per_1m  = 2.00
output_per_1m = 12.00

[costs."gemini-3.1-flash-tts-preview"]
input_per_1m  = 1.00
output_per_1m = 20.00

# The 2.5 TTS prices below are estimates -- verify them before trusting a cost
# comparison between models. A model with no entry here is silently costed at
# zero, so every model offered in the picker needs one.
[costs."gemini-2.5-pro-preview-tts"]
input_per_1m  = 1.00
output_per_1m = 20.00

[costs."gemini-2.5-flash-preview-tts"]
input_per_1m  = 0.50
output_per_1m = 10.00
