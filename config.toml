# The two text models are the *-latest aliases rather than pinned preview IDs.
# gemini-3-pro-preview was withdrawn while it was still advertised by
# models.list(), and every episode failed until someone noticed. Google
# repoints the aliases, so a retirement becomes a quality change instead of an
# outage. Pin a dated ID here instead if you need reproducible output, and
# accept that you are then on the hook for retirements.
#
# TTS has no alias, so it stays pinned -- check /admin/models when it 404s.
[models]
metadata = "gemini-flash-latest"
script   = "gemini-pro-latest"
tts      = "gemini-3.1-flash-tts-preview"

[voices]
host_a = "Puck"
host_b = "Kore"

[script]
target_words = 1600
max_pages    = 120

# How hard the model reasons before writing. Dense papers reward more of it,
# and scripting is ~2% of an episode's cost, so this is cheap to raise.
# One of: MINIMAL, LOW, MEDIUM, HIGH. Leave empty for the model's default.
thinking_level = "HIGH"

# Let the script model search the web while writing. Off by default: the
# citation safeguards assume every claim comes from the PDF, and grounding
# deliberately relaxes that (see prompts/script_grounding.md). When on, the
# sources it used are recorded and shown on the episode.
grounding = false

# If the script model has no quota (a preview Pro often returns limit: 0),
# fall back to this rather than failing the episode. Empty disables the
# fallback. The substitution is recorded in the stage log.
# An alias too: the fallback's whole job is to still be there when the
# primary is not, which a pinned preview ID cannot promise.
fallback_model = "gemini-flash-latest"

# Offered in the "rewrite the script" picker on an episode, so the same paper
# can be written by different models and compared. The configured script model
# and the fallback are always included; list extras here. Verify IDs against
# /admin/models -- a wrong one fails the rewrite with a retirement error.
models = [
  "gemini-pro-latest",
  "gemini-flash-latest",
]

# Tags for browsing the library. Deliberately a fixed vocabulary rather than
# free text: at this size typos and near-duplicates ("AI" / "ai" / "Machine
# Learning") cost more than the flexibility is worth.
#
# An episode can carry several: a paper can be both History and Economics, and
# forcing a single choice would hide it from one of the two filters someone
# would look under.
#
# There is deliberately no "classic" tag. Sorting by citations does that job
# better -- it is a measured quantity rather than a judgement call, and it
# ranks rather than merely including.
#
# The slug is what is stored and what appears in URLs, so renaming a label is
# free but changing a slug orphans the episodes already tagged with it.
[[categories]]
slug  = "ai"
label = "AI"

[[categories]]
slug  = "economics"
label = "Economics"

[[categories]]
slug  = "history"
label = "History"

[[categories]]
slug  = "science"
label = "Science"

[[categories]]
slug  = "policy"
label = "Policy"

# Citation counts come from OpenAlex, which is free and needs no key. They are
# never asked of the language model: a citation count is not printed in the
# paper, so a model has nothing to read it off and would supply a plausible
# number instead -- which here would drive the public sort order.
#
# Lookup is by DOI where the paper printed one. Failures are silent and leave
# the count unset; type it in by hand on the episode instead.
[citations]
enabled = true

[tts]
# Models offered in the upload picker, first one the default. Verify IDs
# against /admin/models before adding — a wrong ID 404s every chunk.
#
# TTS models only. The Live models (gemini-3.1-flash-live-preview,
# gemini-2.5-flash-native-audio-preview-12-2025) are bidirectional streaming
# models for real-time dialogue; they are not reachable through the
# generateContent call this pipeline makes, so listing one here would fail
# every chunk.
models = [
  "gemini-3.1-flash-tts-preview",   # default: expressive, highest cost
  "gemini-2.5-pro-preview-tts",     # high fidelity, aimed at podcasts/audiobooks
  "gemini-2.5-flash-preview-tts",   # fastest and cheapest
]
# Chunk size in words. Split only on speaker-turn boundaries.
chunk_target_words = 250
chunk_max_words    = 320
# How many preceding turns to include as (unspoken) context for prosody.
context_turns      = 2

[retry]
# Transient API failures (429 rate limits, 5xx) are retried on the server's
# own schedule when it supplies one -- Gemini's 429s often ask for 10-30s,
# well past what plain exponential backoff would wait.
attempts     = 4
base_delay_s = 2
max_delay_s  = 60
# Ceiling on a single API call. Without one a stalled connection blocks its
# worker forever: the episode sits in "synthesizing" with no error, and with
# one worker nothing behind it ever starts. Timeouts count as retryable.
request_timeout_s = 600

[audio]
seam_silence_ms = 250
lufs_target     = -16.0
true_peak       = -1.5
lra             = 11.0
bitrate         = "96k"

[server]
base_url = "http://localhost:8000"
port     = 8000
# How many episodes to process at once. The pipeline spends nearly all its
# time waiting on Gemini, so extra workers cost almost no CPU -- the real
# ceilings are the account's requests-per-minute and disk headroom during
# assembly, which briefly needs ~2x an episode's chunk audio. Raise slowly
# and watch for 429s.
workers  = 2

[feed]
title       = "Paperpod"
description = "AI Generated Podcast Discussions of Important Papers."
author      = "Paperpod"

[site]
# Shown on the terms page and used as the podcast owner contact in the feed.
owner_name    = "Josh Paul"
contact_email = "jbpaul275@gmail.com"
# Google Analytics measurement ID. Empty disables the tag entirely -- no script
# tag, no request to Google. It is never loaded for a signed-in admin, so
# editing the library does not turn up in the numbers as reader traffic.
analytics_id  = "G-HH8EPPY7RM"

# USD per 1M tokens, from the published Gemini API rates.
#
# Costs are looked up by the model that ACTUALLY served the request -- the
# response reports it -- falling back to the name we asked for. So the concrete
# entries below are what normally apply, and the *-latest rows are only a
# backstop for a response that does not name its model. When an alias moves to
# something with no entry here, the log says so rather than quietly reading
# $0.00.
[costs."gemini-3.1-pro-preview"]
input_per_1m  = 2.00
output_per_1m = 12.00

# Note: Pro charges 4.00/18.00 above a 200k-token prompt. [script] max_pages is
# 120, which lands well short of that, so the single rate is used.
[costs."gemini-pro-latest"]
input_per_1m  = 2.00
output_per_1m = 12.00

[costs."gemini-3.6-flash"]
input_per_1m  = 1.50
output_per_1m = 7.50

[costs."gemini-3.5-flash"]
input_per_1m  = 1.50
output_per_1m = 7.50

[costs."gemini-flash-latest"]
input_per_1m  = 1.50
output_per_1m = 7.50

[costs."gemini-3-flash-preview"]
input_per_1m  = 0.30
output_per_1m = 2.50

[costs."gemini-3-pro-preview"]
input_per_1m  = 2.00
output_per_1m = 12.00

[costs."gemini-3.1-flash-tts-preview"]
input_per_1m  = 1.00
output_per_1m = 20.00

# 2.5 Pro TTS bills identically to 3.1 Flash TTS, so choosing between those two
# is purely a question of which sounds better. 2.5 Flash halves the output rate,
# and since output is ~97% of an episode that is close to half price.
# A model with no entry here is silently costed at zero, so every model offered
# in the picker needs one.
[costs."gemini-2.5-pro-preview-tts"]
input_per_1m  = 1.00
output_per_1m = 20.00

[costs."gemini-2.5-flash-preview-tts"]
input_per_1m  = 1.00
output_per_1m = 10.00
