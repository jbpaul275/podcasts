<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paperpod{% endblock %}</title>
  <link rel="icon" href="/static/cover.png">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
  <header class="topbar">
    {% block wordmark %}<a class="wordmark" href="/">← Library</a>{% endblock %}
    <span class="health" id="health">&nbsp;</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ static_url('app.js') }}"></script>
</body>
</html>
